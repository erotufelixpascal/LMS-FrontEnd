<body>
    <div class="login-container">
      <h2>Login</h2>
      <!-- <form [formGroup]="loginForm" > -->
      <form [formGroup]="loginForm">
        <label for="username">Email:</label>
        <input type="text" id="email" name="email" formControlName="email">
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" formControlName="password" >
    
        <div class="example-button-row">
          <button mat-raised-button color="accent" type="submit" (click)="login()">Login</button>
          <button mat-raised-button color="primary" routerLink="/signIn">Create account</button>
        </div>
      </form>
    </div>

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    />
    <div class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      Password is required.
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="button-row">
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-secondary" routerLink="/signIn">Create Account</button>
    </div>
  </form>
</div>

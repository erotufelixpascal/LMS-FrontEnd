<div class="login-container">
  <h2>LMS Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      placeholder="Enter your email"
      autocomplete="email"
    />
    <div class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
      Please enter a valid email address.
    </div>

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    />
    <div class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      Password is required.
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="button-row">
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-secondary" routerLink="/signIn">Create Account</button>
    </div>
  </form>
</div>

<!-- Role-based Navbar (sticky top) -->
<ng-container *ngIf="role()">
  <ng-container [ngSwitch]="role()">
    <app-manager-navbar *ngSwitchCase="'manager'"></app-manager-navbar>
    <app-staff-navbar   *ngSwitchCase="'staff'"></app-staff-navbar>
    <app-client-navbar  *ngSwitchCase="'client'"></app-client-navbar>
  </ng-container>
</ng-container>

<!-- Main content -->
<section>
  <router-outlet></router-outlet>
</section>

<!-- Footer always at bottom -->
<app-footer />

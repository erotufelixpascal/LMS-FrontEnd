
<div class="flex flex-row" style="background-color: #333; ">
    <div class="flex flex-col h-full" style="width:250px;">
        <img src="./../../../assets/Person.png" alt="testing">
        <div class="user-greeting" *ngIf="auth.currentUser() as user">
            Welcome, {{ user.firstName }}
        </div>
        <nav class="navbar">
            <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" (click)="goToChildRoute('/client')">
                  <mat-icon>dashboard</mat-icon><span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" (click)="goToChildRoute('/client/loan-application')"
                matTooltip="Define User Roles"
                matTooltipPosition="right"
                aria-tooltip="Button that displays and hides a tooltip triggered by other buttons">
                <mat-icon>request_quote</mat-icon><span>Loan Application</span>
                </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" (click)="goToChildRoute('/client/loan-repayment')">
                <mat-icon>payments</mat-icon><span>Loan Repayment</span>
              </a>
          </li>
            <li class="nav-item">
                <a class="nav-link" (click)="goToChildRoute('/staff/staff-report')">
                  <mat-icon>assessment</mat-icon><span>View Reports</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" (click)="goToChildRoute('/settings')">
                  <mat-icon>settings</mat-icon><span>Settings</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" routerLink="/logout">
                  <mat-icon>logout</mat-icon><span>Logout</span>
                </a>
            </li>
            </ul>
        </nav>
    </div>
    <!-- <router-outlet></router-outlet> -->
  </div>

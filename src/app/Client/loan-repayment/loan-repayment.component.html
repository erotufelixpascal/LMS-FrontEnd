<div class="flex flex-row" style="background-color: #333; ">
    <app-client-navbar></app-client-navbar>
    <section>
        <article>
        <div class="alert alert-warning">
            <strong>⚠️ Warning!</strong> Please ensure repayment amount matches the amount due before submitting.
        </div>

        <!-- Current Date/Time -->
        <div class="timeDate">
            Current Date and Time: {{ currentDateTime }}
        </div>

        <div class="container">
            <h2>Loan Repayment Form</h2>

            <div class="form-container">
                <form [formGroup]="loanRepaymentForm" (ngSubmit)="onSubmit()" class="repayment-form">
                    <div class="form-group">
                        <label for="loanId">Loan ID</label>
                        <input type="text" id="loanId" formControlName="loanId" class="form-control" required placeholder="Enter loan ID" />
                    </div>

                    <div class="form-group">
                        <label for="amountDue">Amount Due</label>
                        <input type="number" id="amountDue" formControlName="amountDue" class="form-control" required placeholder="Enter amount due" />
                    </div>

                    <div class="form-group">
                        <label for="amount">Repayment Amount</label>
                        <input type="number" id="amount" formControlName="amount" class="form-control" required placeholder="Enter repayment amount" />
                    </div>

                    <div class="form-group">
                        <label for="repaymentDate">Repayment Date</label>
                        <input type="date" id="repaymentDate" formControlName="repaymentDate" class="form-control" required />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" [disabled]="loanRepaymentForm.invalid">Submit Repayment</button>
                    </div>
                </form>
            </div>
        </div>
        </article>
    </section>

    <footer>
        <p>© 2024 Loan Management System - Client Dashboard</p>
    </footer>
</div>
